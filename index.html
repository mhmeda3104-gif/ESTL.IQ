<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم الذكي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">اسم المطعم</div>
        <p class="tagline">جودة المذاق في كل طبق</p>
    </header>

    <main class="menu-container">
        <!-- قسم المقبلات -->
        <section class="menu-section">
            <h2 class="section-title">المقبلات</h2>
            <div class="menu-grid">
                <div class="menu-item">
                    <div class="item-info">
                        <h3>سلطة سيزر</h3>
                        <p>خس طازج، صوص سيزر، وقطع خبز محمصة.</p>
                    </div>
                    <span class="price">7,500 د.ع</span>
                </div>
                
                <div class="menu-item">
                    <div class="item-info">
                        <h3>بطاطس مقلية</h3>
                        <p>تقدم مع صوص الكاتشب والثومية.</p>
                    </div>
                    <span class="price">3,000 د.ع</span>
                </div>
            </div>
        </section>

        <!-- قسم الأطباق الرئيسية -->
        <section class="menu-section">
            <h2 class="section-title">الأطباق الرئيسية</h2>
            <div class="menu-grid">
                <div class="menu-item">
                    <div class="item-info">
                        <h3>ستيك مشوي</h3>
                        <p>قطعة لحم فاخرة مع الخضار السوتيه.</p>
                    </div>
                    <span class="price">18,000 د.ع</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>تابعنا على مواقع التواصل الاجتماعي</p>
    </footer>

</body>
</html>
