<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الطابور الذكي - الإصدار الاحترافي</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #1d1d1d;
            --primary-btn: #4facfe;
            --accent-gold: #f39c12;
            --danger: #e74c3c;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --glass-bg: rgba(0, 0, 0, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --primary-btn: #00f2fe;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
            transition: all 0.5s ease;
        }

        .container { width: 100%; max-width: 650px; }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .theme-switch { text-align: left; margin-bottom: 10px; }
        .btn-toggle {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            background: var(--primary-btn);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .display-screen { text-align: center; border: 2px solid var(--primary-btn); }
        .current-number { font-size: 4rem; font-weight: 900; color: var(--accent-gold); margin: 10px 0; }

        /* ستايل قائمة المنتظرين */
        .queue-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .queue-table th { text-align: right; padding: 10px; border-bottom: 1px solid var(--glass-border); opacity: 0.7; }
        .queue-table td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .action-btn {
            padding: 5px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 5px;
        }
        .btn-cancel { background: var(--danger); color: white; }
        .btn-call-small { background: var(--accent-gold); color: white; }

        .empty-msg { text-align: center; opacity: 0.6; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="theme-switch">
        <button class="btn-toggle" onclick="toggleTheme()" id="themeBtn">🌙 الوضع الليلي</button>
    </div>

    <header style="text-align: center; margin-bottom: 20px;">
        <h1>🎓 نظام "نهاية الطوابير"</h1>
        <p>جامعة المستقبل - كلية التقنية الهندسية</p>
    </header>

    <section class="glass-card">
        <h3 style="margin-top: 0;">🎟️ حجز دور جديد</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="nameInput" placeholder="اسم الطالب الثلاثي">
            <select id="serviceSelect" style="width: 150px;">
                <option value="A">شؤون (A)</option>
                <option value="B">حسابات (B)</option>
            </select>
        </div>
        <button class="btn-main" onclick="addTicket()">تأكيد الحجز</button>
    </section>

    <section class="glass-card display-screen">
        <p style="margin:0;">الرقم الحالي قيد الخدمة</p>
        <div class="current-number" id="nowServing">--</div>
        <div id="studentNameDisplay">بانتظار المراجعة...</div>
    </section>

    <section class="glass-card">
        <h3>📋 قائمة المنتظرين في الطابور</h3>
        <div id="queueListContainer">
            <table class="queue-table">
                <thead>
                    <tr>
                        <th>الرقم</th>
                        <th>الاسم</th>
                        <th>العمليات</th>
                    </tr>
                </thead>
                <tbody id="queueBody">
                    </tbody>
            </table>
            <div id="emptyMsg" class="empty-msg">لا يوجد طلاب في الانتظار حالياً</div>
        </div>
    </section>
</div>

<script>
    let queue = [];
    let counters = { A: 100, B: 200 };
    const synth = window.speechSynthesis;

    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById('themeBtn');
        if (html.getAttribute('data-theme') === 'dark') {
            html.removeAttribute('data-theme');
            btn.innerText = "🌙 الوضع الليلي";
        } else {
            html.setAttribute('data-theme', 'dark');
            btn.innerText = "☀️ الوضع النهاري";
        }
    }

    function addTicket() {
        const name = document.getElementById('nameInput').value;
        const type = document.getElementById('serviceSelect').value;
        if (!name.trim()) return alert("يرجى إدخال الاسم");

        counters[type]++;
        const tID = type + counters[type];
        
        const newStudent = { id: Date.now(), name, tID };
        queue.push(newStudent);

        document.getElementById('nameInput').value = "";
        renderQueue();
    }

    function renderQueue() {
        const tbody = document.getElementById('queueBody');
        const emptyMsg = document.getElementById('emptyMsg');
        tbody.innerHTML = "";

        if (queue.length === 0) {
            emptyMsg.style.display = "block";
        } else {
            emptyMsg.style.display = "none";
            queue.forEach((student, index) => {
                const row = `
                    <tr>
                        <td style="font-weight: bold; color: var(--accent-gold);">${student.tID}</td>
                        <td>${student.name}</td>
                        <td>
                            <button class="action-btn btn-call-small" onclick="callSpecific(${index})">استدعاء</button>
                            <button class="action-btn btn-cancel" onclick="removeTicket(${student.id})">إلغاء</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
    }

    function removeTicket(id) {
        if(confirm("هل تريد بالتأكيد إلغاء هذا الحجز؟")) {
            queue = queue.filter(s => s.id !== id);
            renderQueue();
        }
    }

    function callSpecific(index) {
        const student = queue[index];
        
        // تحديث الشاشة الكبيرة
        document.getElementById('nowServing').innerText = student.tID;
        document.getElementById('studentNameDisplay').innerText = `جاري خدمة: ${student.name}`;
        
        // نطق الاسم والرقم
        const speak = new SpeechSynthesisUtterance(`الرقم ${student.tID}، الطالب ${student.name}، تفضل للمكتب`);
        speak.lang = 'ar-SA';
        synth.speak(speak);

        // إزالته من القائمة لأنه قيد الخدمة الآن
        queue.splice(index, 1);
        renderQueue();
    }

    // استدعاء أولي لتجهيز القائمة
    renderQueue();
</script>

</body>
</html>
