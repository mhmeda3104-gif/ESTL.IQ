<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطوط الجامعات العراقية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">IQ-UniBus <i class="fas fa-bus"></i></div>
        <ul class="nav-links">
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#">البحث عن خط</a></li>
            <li><a href="#" class="btn-register">تسجيل سائق</a></li>
        </ul>
    </nav>

    <section class="hero-section">
        <div class="hero-content">
            <h1>طريقك للجامعة صار أسهل</h1>
            <p>أكبر دليل لخطوط النقل الجامعي في كافة المحافظات العراقية</p>
            <div class="search-container">
                <input type="text" placeholder="اكتب اسم الجامعة أو المنطقة...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </section>

    <section class="features">
        <div class="feature-card">
            <i class="fas fa-route"></i>
            <h3>تغطية شاملة</h3>
            <p>من زاخو للبصرة، نغطي أغلب الجامعات.</p>
        </div>
        <div class="feature-card">
            <i class="fas fa-shield-alt"></i>
            <h3>أمان وموثوقية</h3>
            <p>سائقين مسجلين بتقييمات حقيقية.</p>
        </div>
    </section>
</body>
</html>
