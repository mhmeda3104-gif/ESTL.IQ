<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الطابور الذكي V2 - جامعة المستقبل</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --warning: #e67e22;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary);
        }

        header { text-align: center; margin-bottom: 20px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #eee;
        }

        .stat-box span { display: block; font-size: 12px; color: #7f8c8d; }
        .stat-box strong { font-size: 1.5rem; color: var(--primary); }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-join { background: var(--primary); color: white; }
        .btn-join:hover { opacity: 0.9; transform: translateY(-2px); }

        .status-display {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .current-num { font-size: 4rem; margin: 10px 0; color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .admin-section {
            background: #fdf2e9;
            border: 2px dashed var(--warning);
            padding: 20px;
            border-radius: 15px;
            margin-top: 40px;
        }

        .btn-next { background: var(--warning); color: white; margin-top: 10px; }

        /* حركة بسيطة عند التحديث */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .highlight { animation: pulse 0.5s ease-in-out; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏛️ نظام "نهاية الطوابير"</h1>
        <p>كلية التقنية الهندسية - جامعة المستقبل</p>
    </header>

    <div class="stats-grid">
        <div class="stat-box">
            <span>المنتظرون الآن</span>
            <strong id="waitingCount">0</strong>
        </div>
        <div class="stat-box">
            <span>متوسط الانتظار</span>
            <strong id="avgTime">--</strong>
        </div>
    </div>

    <section class="card">
        <h3>🎟️ حجز تذكرة إلكترونية</h3>
        <input type="text" id="studentName" placeholder="أدخل اسمك الثلاثي">
        <select id="serviceType">
            <option value="A">شؤون الطلبة (A)</option>
            <option value="B">الحسابات (B)</option>
        </select>
        <button onclick="joinQueue()" class="btn btn-join">احجز دورك الآن</button>
    </section>

    <section class="card status-display">
        <p>الرقم الذي يتم خدمته الآن</p>
        <div id="currentNumber" class="current-num">--</div>
        <p id="serviceIndicator">يرجى الانتظار...</p>
    </section>

    <div id="userTicketBox" class="card" style="display:none; border-top-color: var(--accent);">
        <p>رقم تذكرتك الخاص هو:</p>
        <h2 id="userTicket" style="color: var(--accent); font-size: 2.5rem; margin: 0;"></h2>
        <p style="font-size: 13px;">سنقوم بتنبيهك عند اقتراب دورك!</p>
    </div>

    <div class="admin-section">
        <h3>🛠️ لوحة تحكم الموظف</h3>
        <button onclick="nextCustomer()" class="btn btn-next">استدعاء الرقم التالي (صوتي) 🔊</button>
    </div>
</div>

<script>
    let queue = [];
    let counters = { A: 100, B: 200 };
    
    // لإضافة تأثير التنبيه الصوتي
    const synth = window.speechSynthesis;

    function joinQueue() {
        const name = document.getElementById('studentName').value;
        const type = document.getElementById('serviceType').value;

        if (!name) { alert("أدخل اسمك أولاً!"); return; }

        counters[type]++;
        const ticketId = type + counters[type];

        const student = {
            name: name,
            ticket: ticketId,
            time: new Date()
        };

        queue.push(student);
        updateUI();

        // إظهار تذكرة الطالب
        document.getElementById('userTicketBox').style.display = 'block';
        document.getElementById('userTicket').innerText = ticketId;
        document.getElementById('studentName').value = "";
    }

    function nextCustomer() {
        if (queue.length > 0) {
            const next = queue.shift();
            const msg = `الرقم ${next.ticket}، يرجى التوجه للمكتب`;
            
            // تحديث الشاشة
            const display = document.getElementById('currentNumber');
            display.innerText = next.ticket;
            display.classList.add('highlight');
            setTimeout(() => display.classList.remove('highlight'), 500);

            document.getElementById('serviceIndicator').innerText = `جاري خدمة: ${next.name}`;

            // استدعاء صوتي (Text to Speech)
            const utterance = new SpeechSynthesisUtterance(msg);
            utterance.lang = 'ar-SA';
            synth.speak(utterance);

            updateUI();
        } else {
            alert("لا يوجد أحد في الطابور!");
        }
    }

    function updateUI() {
        document.getElementById('waitingCount').innerText = queue.length;
        // حساب وقت تقريبي (مثلاً 5 دقائق لكل طالب)
        document.getElementById('avgTime').innerText = (queue.length * 5) + " دقيقة";
    }
</script>

</body>
</html>
