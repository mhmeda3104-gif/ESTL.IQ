<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الطابور الذكي - جامعة المستقبل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 نظام نهاية الطوابير</h1>
            <p>احجز دورك وأنت في مكانك</p>
        </header>

        <section class="card shadow">
            <h2>حجز دور جديد</h2>
            <input type="text" id="studentName" placeholder="أدخل اسمك الثلاثي">
            <select id="serviceType">
                <option value="شؤون الطلبة">شؤون الطلبة</option>
                <option value="الحسابات">الحسابات</option>
            </select>
            <button onclick="joinQueue()" class="btn-primary">حجز رقم الآن</button>
        </section>

        <section class="card status-card">
            <div class="status-box">
                <p>الرقم الحالي</p>
                <h3 id="currentNumber">--</h3>
            </div>
            <div class="status-box">
                <p>رقمك</p>
                <h3 id="yourNumber">--</h3>
            </div>
        </section>

        <hr>
        <section class="admin-panel">
            <h3>لوحة الموظف (للتجربة)</h3>
            <button onclick="nextCustomer()" class="btn-secondary">استدعاء الرقم التالي</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
